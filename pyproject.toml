[project]
name = "maqina"
version = "0.15.0"
description = "A Magnus-based quantum Ising numerical annealer: matrix-free time evolution of the transverse-field Ising model via Magnus expansion"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
    "threadpoolctl>=3.0",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# maturin 公式 docs 推奨の mixed Rust/Python project レイアウト.
# Python ソースを python/maqina/ に置き、Cargo.toml + src/lib.rs は
# プロジェクトルート直下. PyO3/maturin#490 で報告されている
# ModuleNotFoundError pitfall を回避するため "python" を明示する.
python-source = "python"
module-name = "maqina._rust"
features = ["extension-module"]
profile = "production"
strip = true

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "maturin>=1.7,<2.0",
    "pre-commit>=4.0",
    "pytest>=8.3.0",
    "qutip>=5.2.3",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]

[tool.pytest.ini_options]
# --doctest-modules で python/maqina 配下の docstring 例 (>>> ブロック) を収集・
# 実行し, Phase 跨ぎの API 変更で例が壊れたら CI で検出できるようにする (issue #163).
# python_files = ["test_*.py"] は維持するので tests/ 側は通常のテスト関数のみ収集され,
# python/maqina/ 側は doctest のみが収集される (二重収集なし).
addopts = ["--doctest-modules"]
testpaths = ["tests", "python/maqina"]
python_files = ["test_*.py"]
# ELLIPSIS (...) と NORMALIZE_WHITESPACE で出力例の脆さを緩和する.
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "slow: 重い統合テスト (Solver.run / 大規模ベンチ等). pytest -m 'not slow' で除外可",
]
